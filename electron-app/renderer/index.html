<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; style-src 'self'">
  <title>RomM2SteamDeck</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar: platforms -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <span class="brand">R2SD</span>
        <button id="btn-settings" class="icon-btn" title="Settings">&#9881;</button>
      </div>
      <nav id="platform-list" class="platform-list">
        <p class="muted pad">Loading platforms&hellip;</p>
      </nav>
      <div class="sidebar-footer">
        <span id="cache-status" class="muted small"></span>
      </div>
    </aside>

    <!-- Main: game grid -->
    <main id="content">
      <header id="toolbar">
        <h1 id="platform-title">Library</h1>
        <div class="toolbar-controls">
          <input id="search" type="search" placeholder="Search games&hellip;" autocomplete="off">
          <select id="genre-filter" title="Filter by genre">
            <option value="">All genres</option>
          </select>
          <select id="sort" title="Sort order">
            <option value="name">Name</option>
            <option value="size">Size</option>
            <option value="year">Release Year</option>
            <option value="rating">Rating</option>
          </select>
          <button id="btn-refresh" class="icon-btn" title="Refresh from server">&#8635;</button>
        </div>
      </header>
      <div id="grid-status" class="muted pad" hidden></div>
      <section id="game-grid" class="game-grid"></section>
    </main>
  </div>

  <!-- Game detail modal -->
  <div id="detail-modal" class="modal" hidden>
    <div class="modal-backdrop" id="detail-backdrop"></div>
    <div class="modal-card detail-card">
      <button class="detail-close icon-btn" id="btn-close-detail" title="Close">&#10005;</button>
      <div class="detail-body">
        <div class="detail-cover cover-wrap"><img class="game-cover" alt=""></div>
        <div class="detail-info">
          <h2 id="detail-name"></h2>
          <div id="detail-facts" class="detail-facts"></div>
          <p id="detail-summary" class="detail-summary"></p>
          <div class="detail-actions">
            <select id="detail-install-path" hidden></select>
            <button id="btn-dl" class="primary" hidden>&#8681; Download</button>
            <button id="btn-dl-cancel" class="secondary" hidden>Cancel</button>
            <button id="btn-dl-delete" class="secondary danger" hidden>Delete from disk</button>
            <span id="detail-dl-status" class="small muted"></span>
          </div>
          <div class="dl-bar" id="detail-dl-bar" hidden><div class="dl-bar-fill"></div></div>
        </div>
      </div>
      <div id="detail-screenshots" class="detail-screenshots"></div>
    </div>
  </div>

  <!-- Platform folders modal -->
  <div id="platforms-modal" class="modal" hidden>
    <div class="modal-backdrop" id="platforms-backdrop"></div>
    <div class="modal-card platforms-card">
      <h2>Platform Folders</h2>
      <p class="small muted" style="margin-bottom:12px">
        Set where each platform's games go. Enable <strong>Extract</strong> for platforms whose
        games are archives that should be unpacked (e.g. Windows) and give them an install path.
      </p>
      <div class="platform-defaults">
        <label>Base folder for auto-fill
          <span class="path-row">
            <input id="pf-base" type="text" placeholder="e.g. C:\Games\ROMs or /home/deck/retrodeck/roms">
            <button class="icon-btn" id="pf-base-browse" title="Browse">&#128193;</button>
            <button class="secondary" id="pf-autofill" title="Fill empty folders with base/slug">Auto-fill empty</button>
          </span>
        </label>
        <label>Staging folder for archives (optional — defaults to the install path)
          <span class="path-row">
            <input id="pf-staging" type="text" placeholder="Where archives are downloaded before extraction">
            <button class="icon-btn" id="pf-staging-browse" title="Browse">&#128193;</button>
          </span>
        </label>
      </div>
      <div id="pf-rows" class="pf-rows"></div>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button id="pf-save" class="primary">Save</button>
        <button id="pf-close" class="secondary">Close</button>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div id="toasts"></div>

  <!-- Settings modal -->
  <div id="settings-modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <h2>Settings</h2>
      <label>RomM Server URL
        <input id="cfg-url" type="text" placeholder="https://romm.example.com" autocomplete="off">
      </label>
      <label>Username
        <input id="cfg-username" type="text" autocomplete="off">
      </label>
      <label>Password
        <input id="cfg-password" type="password" placeholder="(unchanged)" autocomplete="off">
      </label>
      <div id="cfg-test-result" class="small"></div>
      <div class="modal-actions">
        <button id="btn-platforms" class="secondary">Platform Folders&hellip;</button>
        <button id="btn-clear-cache" class="secondary">Clear Cache</button>
        <span class="spacer"></span>
        <button id="btn-test" class="secondary">Test Connection</button>
        <button id="btn-save" class="primary">Save</button>
        <button id="btn-close-settings" class="secondary">Close</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
